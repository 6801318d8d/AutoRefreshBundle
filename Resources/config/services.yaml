services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false
        bind:
            $projectDir: '%kernel.project_dir%'

    KimaiPlugin\AutoRefreshBundle\EventSubscriber\:
        resource: '../../EventSubscriber/'

    KimaiPlugin\AutoRefreshBundle\Sync\:
        resource: '../../Sync/'

    KimaiPlugin\AutoRefreshBundle\Controller\:
        resource: '../../Controller/'
        public: true
        tags: ['controller.service_arguments']
